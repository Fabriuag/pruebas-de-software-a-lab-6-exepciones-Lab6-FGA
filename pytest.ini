[pytest]
markers =
    q: prueba de ZeroDivisionError
    y: prueba de TypeError
    w: prueba de IndexError
    e: prueba de KeyError
    r: prueba de FileNotFoundError
    t: prueba de AttributeError
    wip: prueba de MyException
    capsys: pruebas que capturan la salida con capsys
    fixture: pruebas que usan fixtures
    param: pruebas parametrizadas
    setattr: pruebas con monkeypatch.setattr
    delattr: pruebas con monkeypatch.delattr
 